plugins { id 'com.android.application' }
configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' } }
def hisabSign = { String k ->
 def lp = new Properties(); def f = rootProject.file('local.properties'); if (f.exists()) f.withInputStream { lp.load(it) }
 return System.getenv('HISAB_' + k.toUpperCase()) ?: lp.getProperty('hisab.' + k)
}
android {
 namespace 'in.aicon.hisab'
 compileSdk 36
 buildFeatures { buildConfig true }
 defaultConfig {
  applicationId 'in.aicon.hisab.studio2'
  minSdk 26
  targetSdk 35
  ndk { abiFilters 'arm64-v8a' }
  versionCode 62
  versionName '1.0.39-pro'
 }
 signingConfigs {
  release {
   def path = hisabSign('storeFile')
   if (path) { storeFile file(path); storePassword hisabSign('storePassword'); keyAlias hisabSign('keyAlias') ?: 'hisab'; keyPassword hisabSign('keyPassword') ?: hisabSign('storePassword') }
  }
 }
 buildTypes { release { if (hisabSign('storeFile')) signingConfig signingConfigs.release } }
 testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty "robolectric.dependency.repo.url", "https://maven-central.storage-download.googleapis.com/maven2"; maxHeapSize = "512m"; forkEvery = 1 } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.core:core:1.15.0'
 implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
 implementation 'com.google.android.gms:play-services-auth:20.7.0'
 implementation 'net.zetetic:sqlcipher-android:4.6.1@aar'
 implementation 'androidx.sqlite:sqlite:2.2.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.17'
}

// A release build without the signing key fails here, with the steps to fix it. Debug builds and tests are not affected.
gradle.taskGraph.whenReady { graph ->
 def wantsRelease = graph.allTasks.any { it.path.startsWith(':studio:') && (it.name == 'assembleRelease' || it.name == 'bundleRelease') }
 if (wantsRelease && !(hisabSign('storeFile') && hisabSign('storePassword') && file(hisabSign('storeFile')).exists())) {
  throw new GradleException('Release signing key not found. Set HISAB_STOREFILE and HISAB_STOREPASSWORD (or hisab.storeFile and hisab.storePassword in local.properties). See docs/SIGNING.md. Do not create a new key.')
 }
}
